name: Node 22 Types Temp

on:
  push:
    branches:
      - chore/node22-runtime-contract
    paths:
      - ".github/workflows/node22-types-temp.yml"

permissions:
  contents: write

jobs:
  align-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/node22-runtime-contract
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Alinhar tipos do Node 22
        run: |
          npm pkg set 'devDependencies.@types/node=^22'
          npm install --package-lock-only --ignore-scripts

      - name: Validar lockfile e aplicação
        run: |
          npm ci --no-audit --no-fund
          node -e "const p=require('./package.json'); if(p.devDependencies['@types/node'] !== '^22') throw new Error('@types/node não alinhado'); console.log('@types/node', p.devDependencies['@types/node'])"
          npm audit --omit=dev --audit-level=high
          npm run lint
          npx tsc --noEmit
          npx wrangler --version

      - name: Persistir ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/node22-types-temp.yml
          git add package.json package-lock.json
          git commit -m "chore(runtime): align Node 22 types"
          git push origin HEAD:chore/node22-runtime-contract
