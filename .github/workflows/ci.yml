name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Segurança + lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  tests:
    name: Supabase efêmero + testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund --prefer-offline

      # Ambiente isolado e descartável no runner do GitHub. Não acessa nem
      # altera o projeto Supabase DEV hospedado.
      - name: Subir Supabase efêmero no runner
        run: npx supabase start

      - name: Rodar migrations e testes no ambiente efêmero
        run: |
          eval "$(npx supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/backfill-song-arrangements.sql
          npx vitest run

      - name: Descartar ambiente Supabase efêmero
        if: always()
        run: npx supabase stop || true
