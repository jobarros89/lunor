name: CI

# CI principal executado em runners hospedados pelo GitHub.
# O orçamento da conta limita o consumo e interrompe novas execuções ao atingir o teto.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_supabase_tests:
        description: "Executar Supabase efêmero no runner hospedado"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Segurança + lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      supabase_required: ${{ steps.supabase_changes.outputs.required }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detectar alterações sensíveis ao Supabase
        id: supabase_changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const eventName = process.env.EVENT_NAME;
          let required = false;
          let matched = [];

          function requestJson(path) {
            return new Promise((resolve, reject) => {
              const request = https.request({
                hostname: 'api.github.com',
                path,
                method: 'GET',
                headers: {
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'lunor-ci',
                },
              }, (response) => {
                let body = '';
                response.setEncoding('utf8');
                response.on('data', (chunk) => { body += chunk; });
                response.on('end', () => {
                  if (response.statusCode < 200 || response.statusCode >= 300) {
                    reject(new Error(`GitHub API ${response.statusCode}: ${body}`));
                    return;
                  }
                  try {
                    resolve(JSON.parse(body));
                  } catch (error) {
                    reject(error);
                  }
                });
              });
              request.on('error', reject);
              request.end();
            });
          }

          async function main() {
            if (eventName === 'pull_request') {
              const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
              const prNumber = process.env.PR_NUMBER;
              const filenames = [];

              for (let page = 1; ; page += 1) {
                const batch = await requestJson(
                  `/repos/${owner}/${repo}/pulls/${prNumber}/files?per_page=100&page=${page}`,
                );
                filenames.push(...batch.map((file) => file.filename));
                if (batch.length < 100) break;
              }

              const sensitivePrefixes = [
                'supabase/',
                'tests/sql/',
                'tests/rls/',
                'src/lib/supabase/',
                'src/lib/auth/',
              ];
              const sensitiveFiles = [
                '.github/workflows/ci.yml',
              ];

              matched = filenames.filter((filename) =>
                sensitiveFiles.includes(filename)
                || sensitivePrefixes.some((prefix) => filename.startsWith(prefix)),
              );
              required = matched.length > 0;
            }

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `required=${required}\n`,
            );

            if (eventName !== 'pull_request') return;

            if (required) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                [
                  '### Supabase efêmero será executado',
                  '',
                  'Esta PR altera arquivos sensíveis ao banco, autenticação ou ao próprio CI.',
                  '',
                  `Arquivos sensíveis detectados: **${matched.length}**.`,
                  '',
                ].join('\n'),
              );
            } else {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                [
                  '### Supabase efêmero não necessário',
                  '',
                  'Nenhuma alteração sensível ao banco foi detectada nesta PR.',
                  '',
                ].join('\n'),
              );
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

  tests:
    name: Supabase efêmero + testes
    needs: quality
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_supabase_tests) || (github.event_name == 'pull_request' && needs.quality.outputs.supabase_required == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund --prefer-offline

      # Ambiente isolado e descartável no runner do GitHub. Não acessa nem
      # altera o projeto Supabase DEV hospedado.
      - name: Subir Supabase efêmero no runner
        run: npx supabase start

      - name: Rodar migrations e testes no ambiente efêmero
        run: |
          eval "$(npx supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/backfill-song-arrangements.sql
          npx vitest run

      - name: Descartar ambiente Supabase efêmero
        if: always()
        run: npx supabase stop || true
