name: Apply home assigned-service priority fix

on:
  push:
    branches: [fix/home-prioritize-assigned-service]
    paths: [.github/workflows/apply-home-priority-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-prioritize-assigned-service
      - name: Prioritize assigned service on Home
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/[churchSlug]/page.tsx')
          s = p.read_text()
          old = '''  const nextAssignedEvent = firstRelated(escalas[0]?.events);\n  const nextEvent =\n    (nextChurchEvent as unknown as AssignmentEvent | null) ?? nextAssignedEvent;'''
          new = '''  const nextAssignedEvent = firstRelated(escalas[0]?.events);\n  // A Home é pessoal: se o usuário tem uma escala futura, ela tem prioridade\n  // sobre o próximo culto geral da igreja. O culto geral é apenas fallback.\n  const nextEvent =\n    nextAssignedEvent ?? (nextChurchEvent as unknown as AssignmentEvent | null);'''
          if old not in s:
              raise SystemExit('Trecho de seleção do hero não encontrado')
          s = s.replace(old, new, 1)
          old2 = '''  const imminentEvent = (() => {\n    if (!nextEvent) return null;\n    const startMs = new Date(nextEvent.starts_at).getTime();\n    const endMs = nextEvent.ends_at ? new Date(nextEvent.ends_at).getTime() : startMs + 2 * 60 * 60 * 1000;\n    const startsWithinWindow = startMs - nowMs <= CULT_MODE_WINDOW_MS && startMs - nowMs > 0;\n    const alreadyStartedNotEnded = startMs <= nowMs && nowMs < endMs;\n    return (startsWithinWindow || alreadyStartedNotEnded) ? nextEvent : null;\n  })();'''
          new2 = '''  const imminentEvent = (() => {\n    // O modo culto continua acompanhando o próximo culto geral, mesmo quando\n    // o hero pessoal prioriza uma escala posterior do usuário.\n    const candidate = (nextChurchEvent as unknown as AssignmentEvent | null) ?? nextEvent;\n    if (!candidate) return null;\n    const startMs = new Date(candidate.starts_at).getTime();\n    const endMs = candidate.ends_at ? new Date(candidate.ends_at).getTime() : startMs + 2 * 60 * 60 * 1000;\n    const startsWithinWindow = startMs - nowMs <= CULT_MODE_WINDOW_MS && startMs - nowMs > 0;\n    const alreadyStartedNotEnded = startMs <= nowMs && nowMs < endMs;\n    return (startsWithinWindow || alreadyStartedNotEnded) ? candidate : null;\n  })();'''
          if old2 not in s:
              raise SystemExit('Trecho do modo culto não encontrado')
          p.write_text(s.replace(old2, new2, 1))
          PY
          rm .github/workflows/apply-home-priority-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/'[churchSlug]'/page.tsx .github/workflows/apply-home-priority-fix.yml
          git commit -m "fix: prioritize assigned service on home"
          git push origin HEAD:fix/home-prioritize-assigned-service
