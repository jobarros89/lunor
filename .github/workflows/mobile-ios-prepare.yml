name: Prepare iOS Capacitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar gerador de ícones
        run: node --check scripts/generate-mobile-icons.mjs

      - name: Preparar webDir mínimo
        run: |
          mkdir -p out
          printf '<!doctype html><html><body>LUNOR</body></html>' > out/index.html

      - name: Gerar shell iOS com branding LUNOR
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          npm run mobile:icons

      - name: Validar projeto Xcode sem assinatura
        run: xcodebuild -project ios/App/App.xcodeproj -list

      - uses: actions/upload-artifact@v4
        with:
          name: lunor-ios-project
          path: ios
          if-no-files-found: error
