name: Bundle Analysis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/bundle-analysis.yml
  push:
    branches: [perf/bundle-baseline]
    paths:
      - .github/workflows/bundle-analysis.yml

permissions:
  contents: read

concurrency:
  group: bundle-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar bundle Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Valores sintéticos apenas para compilação/análise. Nenhum segredo ou
      # projeto Supabase real é acessado por este workflow.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_bundle_analysis_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Gerar análise do Turbopack
        run: npx next experimental-analyze --output

      - name: Resumo dos arquivos gerados
        run: |
          echo "## Bundle analysis" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          du -ah .next/diagnostics/analyze | sort -h | tail -n 40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: next-bundle-analysis
          path: .next/diagnostics/analyze
          if-no-files-found: error
          retention-days: 7
