name: Node 22 Runtime Contract Temp

on:
  push:
    branches:
      - chore/node22-runtime-contract
    paths:
      - ".github/workflows/node22-runtime-contract-temp.yml"

permissions:
  contents: write

jobs:
  normalize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/node22-runtime-contract
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Padronizar contrato Node 22
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.engines = { ...(pkg.engines || {}), node: '>=22.0.0' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const readmePath = 'README.md';
          const readme = fs.readFileSync(readmePath, 'utf8');
          const updated = readme.replace('- Node.js 20+', '- Node.js 22+');
          if (updated === readme) throw new Error('README não contém o requisito Node.js 20+ esperado');
          fs.writeFileSync(readmePath, updated);

          fs.writeFileSync('.nvmrc', '22.23.2\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Validar runtime e lockfile
        run: |
          node -e "const major=Number(process.versions.node.split('.')[0]); if(major!==22) throw new Error('Node 22 esperado, recebido ' + process.version); console.log('Node', process.version)"
          npm ci --no-audit --no-fund
          node -e "const p=require('./package.json'); if(p.engines?.node !== '>=22.0.0') throw new Error('engines.node incorreto'); console.log('engines.node', p.engines.node)"
          test "$(cat .nvmrc)" = "22.23.2"

      - name: Segurança, lint e TypeScript
        run: |
          npm audit --omit=dev --audit-level=high
          npm run lint
          npx tsc --noEmit

      - name: Validar toolchain Cloudflare local
        run: |
          npx wrangler --version
          node -e "const p=require('./node_modules/@opennextjs/cloudflare/package.json'); console.log('@opennextjs/cloudflare', p.version)"

      - name: Persistir somente os arquivos finais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/node22-runtime-contract-temp.yml
          git add .nvmrc README.md package.json package-lock.json
          git commit -m "chore(runtime): standardize Node 22"
          git push origin HEAD:chore/node22-runtime-contract
