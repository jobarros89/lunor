name: Temporary sharp security refresh

on:
  push:
    branches: [fix/security-sharp-0354]
    paths:
      - ".github/workflows/security-sharp-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-sharp-0354
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fixar sharp corrigido em toda a árvore
        run: |
          npm pkg set devDependencies.sharp=0.35.4
          npm pkg set overrides.sharp=0.35.4
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validar árvore do sharp
        run: |
          npm ci --no-audit --no-fund
          npm ls sharp
          node -e "const { execSync } = require('node:child_process'); const out = execSync('npm ls sharp --json', { encoding: 'utf8' }); const tree = JSON.parse(out); function walk(n,p='root'){ if(n && n.dependencies){ for(const [k,v] of Object.entries(n.dependencies)){ if(k==='sharp' && v.version !== '0.35.4') throw new Error('sharp vulnerável/inesperado em '+p+': '+v.version); walk(v,p+' > '+k); } } } walk(tree); console.log('Toda a árvore sharp está em 0.35.4.');"

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Validar código
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Verificar credencial para build Cloudflare
        id: cloudflare_auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN não está disponível neste workflow; build remoto será validado pelo pipeline com credenciais."
          fi

      - name: Validar build OpenNext para Cloudflare
        if: steps.cloudflare_auth.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx opennextjs-cloudflare build

      - name: Persistir correção validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "fix(security): patch sharp libheif vulnerability"
            git push origin HEAD:fix/security-sharp-0354
          fi
