name: Security dependency refresh

on:
  push:
    branches: [fix/npm-audit-sharp-cloudflare]
    paths:
      - ".github/workflows/security-dependency-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npm-audit-sharp-cloudflare
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fixar versões e override transitivo seguro
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          Object.assign(pkg.dependencies, {
            '@opennextjs/cloudflare': '1.20.6',
            '@capacitor/android': '8.5.1',
            '@capacitor/core': '8.5.1',
            '@capacitor/ios': '8.5.1',
          });

          Object.assign(pkg.devDependencies, {
            '@capacitor/cli': '8.5.1',
            sharp: '0.35.4',
            vitest: '4.1.11',
            wrangler: '4.130.0',
          });

          pkg.overrides = {
            ...(pkg.overrides ?? {}),
            miniflare: {
              ...(pkg.overrides?.miniflare ?? {}),
              sharp: '0.35.4',
            },
          };
          delete pkg.overrides.xcode;

          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Resolver dependências
        run: npm install --no-audit --no-fund

      - name: Validar instalação reprodutível com npm ci
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund --prefer-offline

      - name: Mostrar cadeias resolvidas
        run: npm ls @opennextjs/cloudflare wrangler miniflare sharp vitest @vitest/mocker @capacitor/cli xcode uuid || true

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Garantir zero vulnerabilidades altas na árvore completa
        run: npm audit --audit-level=high

      - name: Relatar moderadas dev-only remanescentes
        run: npm audit --audit-level=moderate || true

      - name: Validar Capacitor CLI
        run: npx cap --version

      - name: Validar lint e TypeScript
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Validar build OpenNext para Cloudflare
        run: npm run cf:build

      - name: Persistir dependências validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "security: update audited dependencies"
            git push origin HEAD:fix/npm-audit-sharp-cloudflare
          fi
