name: Mobile Capacitor

# Modo econômico: build Android somente sob demanda enquanto a franquia de
# GitHub Actions estiver esgotada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências do projeto
        run: npm ci --no-audit --no-fund

      - name: Validar aplicação
        run: |
          npm run lint
          npx tsc --noEmit
          node --check scripts/generate-mobile-icons.mjs

      - name: Gerar projeto Android com branding LUNOR
        run: |
          mkdir -p out
          printf '<!doctype html><html><body>LUNOR</body></html>' > out/index.html
          rm -rf android
          npx cap add android
          npx cap sync android
          npm run mobile:icons

      - name: Gerar APK de validação
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lunor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
