workflows:
  ios-capacitor-compile:
    name: LUNOR iOS - compile proof
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Create temporary Capacitor web fallback
        script: |
          mkdir -p out
          cat > out/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head><meta charset="utf-8"><title>LUNOR</title></head>
            <body><main>LUNOR</main></body>
          </html>
          EOF

      - name: Generate native iOS project
        script: npx cap add ios

      - name: Sync Capacitor and app icons
        script: npm run mobile:ios

      - name: Compile iOS simulator app without signing
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
